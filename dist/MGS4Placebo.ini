[MouseFix]

Enable = true

# Reads mouse movement straight from the device instead of from cursor
# positions, removing Windows pointer acceleration and the desktop
# pointer-speed setting from camera control.
RawInput = true

# Horizontal camera speed, as a multiplier over the stock speed.
CameraSensitivityX = 1.0

# Vertical camera speed, as a multiplier over the stock speed.
CameraSensitivityY = 1.0

[Rendering]

# Multisampling for the main scene render targets.
# 0 - 16, 0 leaves the game as it is.
MSAA = 4

# Smooths the edges of cutouts, the alpha tested foliage, fences and 
# railings that multisampling alone does nothing for.
MSAACutouts = true

# Turns on multisample rasterization for every draw. Without it the
# hardware takes one sample per pixel whatever the render target holds,
# so multisampled targets resolve to the same aliased image.
MSAAForceRasterizer = true

# Logs bgfx error messages around framebuffer creation.
MSAALogCreateResults = false

# Logs which render targets get attached to each framebuffer, to show
# which ones have to share a sample count.
MSAALogFrameBuffers = false

# Logs every render target as it is created, with the flags it ends up
# with.
MSAALogTargets = false

[Resolution]

Enable = false

# Width/height the game renders at, independent of the window. 0 keeps whatever
# the game worked out for itself.
BufferWidth = 0
BufferHeight = 0

# Keeps the aiming reticle on screen when rendering wider or taller than
# 4096 pixels. Below that it changes nothing.
FixReticle = true

# Removes the 5760x2160 ceiling and the clamp that caps the game to the
# size the monitor reports, so a larger resolution set in the game's own
# settings is used as asked for.
UnlockLimits = true

[Shaders]

# Writes every shader the engine creates into a shader_dump folder next 
# to this DLL. Catches any bgfx shader packs passed to the renderer.
Dump = false

# Loads shaders from a shader_replace folder next to this DLL, by the
# same filename the dump uses.
Replace = false
